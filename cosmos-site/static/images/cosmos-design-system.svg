    <radialGradient id="core">
      <stop stop-color="#ffc766"/>
      <stop offset=".52" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#7a3409"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
