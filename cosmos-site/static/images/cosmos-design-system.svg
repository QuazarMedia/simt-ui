    <circle r="192" stroke="#ffc766" stroke-opacity=".2"/>
    <circle r="130" stroke="#c9a0ff" stroke-opacity=".22" stroke-dasharray="2 8"/>
    <circle r="72" fill="#ff8c42" opacity=".14" filter="url(#glow)"/>
    <circle r="62" fill="#120a14" stroke="url(#spectrum)" stroke-width="4"/>
    <circle r="39" fill="url(#core)"/>
    <path d="M-82-47v-23h23M59-70h23v23M82 47v23H59M-59 70h-23V47" stroke="#ffc766" stroke-width="2"/>
