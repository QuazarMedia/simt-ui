<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cosmos Design System by SIMT</title>
  <desc id="desc">Warm aubergine field with orbital signals and the Cosmos semantic color spectrum.</desc>
  <defs>
    <radialGradient id="field" cx="76%" cy="45%" r="58%">
      <stop offset="0" stop-color="#352040"/>
      <stop offset=".42" stop-color="#1f1126"/>
      <stop offset="1" stop-color="#120a14"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0" x2="1">
      <stop stop-color="#ff8c42"/>
      <stop offset=".22" stop-color="#ff7e8a"/>
      <stop offset=".44" stop-color="#c9a0ff"/>
      <stop offset=".65" stop-color="#ffc766"/>
      <stop offset=".83" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#83b692"/>
