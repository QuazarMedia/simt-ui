name: release

on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve library tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      library: ${{ steps.tag.outputs.library }}
      version: ${{ steps.tag.outputs.version }}
      target: ${{ steps.tag.outputs.target }}
      package: ${{ steps.tag.outputs.package }}
    steps:
      - name: Parse <library>-v<version> tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^([a-z0-9]+(-[a-z0-9]+)*)-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            library="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[3]}"
          else
            echo "::error::Release tags must look like <library>-vMAJOR.MINOR.PATCH (for example app-ui-v1.2.3)"
            exit 1
          fi
          # Each release unit is registered here before it can be tagged.
          case "$library" in
            app-ui)
              target="Maven Central"
              package="app.simt:app-ui"
              ;;
            *)
              echo "::error::Unknown release library '$library'; add its publish job before tagging."
              exit 1
              ;;
          esac
          {
            echo "library=$library"
            echo "version=$version"
            echo "target=$target"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"

  app_ui:
    name: app-ui to Maven Central
    needs: resolve
    if: needs.resolve.outputs.library == 'app-ui'
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify declared version
        env:
          TAG_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          declared="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' gradle.properties)"
          if [ "$declared" != "$TAG_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match VERSION_NAME=$declared"
            exit 1
          fi

      - name: Check release secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=""
          [ -n "$CENTRAL_USERNAME" ] || missing="$missing CENTRAL_PORTAL_USERNAME"
          [ -n "$CENTRAL_PASSWORD" ] || missing="$missing CENTRAL_PORTAL_PASSWORD"
          [ -n "$SIGNING_KEY" ] || missing="$missing SIGNING_KEY"
          [ -n "$SIGNING_PASSWORD" ] || missing="$missing SIGNING_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release environment secrets:$missing"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cosmos-spec/package-lock.json
            cosmos-site/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.1.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install locked Cosmos tooling
        run: |
          npm --prefix cosmos-spec ci --ignore-scripts --no-audit --no-fund
          npm --prefix cosmos-site ci --ignore-scripts --no-audit --no-fund

      - name: Verify release authorization
        run: >-
          ./gradlew --no-daemon --max-workers=2 releaseCheck
          -PVERSION_NAME="${{ needs.resolve.outputs.version }}"

      - name: Publish to Maven Central
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --max-workers=2 publishAggregationToCentralPortal
          -PVERSION_NAME="${{ needs.resolve.outputs.version }}"
          --stacktrace

  release:
    name: create GitHub release
    needs: [resolve, app_ui]
    if: always() && needs.app_ui.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          LIBRARY: ${{ needs.resolve.outputs.library }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ needs.resolve.outputs.target }}
          PACKAGE: ${{ needs.resolve.outputs.package }}
        run: |
          set -euo pipefail
          notes="$(awk -v lib="$LIBRARY" -v v="$VERSION" -f scripts/release-notes.awk CHANGELOG.md)"
          {
            if [ -n "$notes" ]; then
              printf '%s\n\n' "$notes"
            fi
            printf 'Published to %s as %s %s.\n' "$TARGET" "$PACKAGE" "$VERSION"
          } > release-notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --notes-file release-notes.md
